<!DOCTYPE html> 
<html lang="pt-br">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Whack-a-Mole</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="imagens/icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="cabecalho">
            <img class="logo" src="imagens/logo.png" alt="Whack-a-Mole">

            <nav class="menu">
                <a href="novo-jogo.html">Jogo</a>
                <a href="ranking.html">Ranking</a>
                <a href="perfil.html" class="ativo">Meu perfil</a>
                <a href="index.html">Sair</a>
            </nav>
        </header>
        <main class="caixa perfil">
            <h1>Perfil</h1>

            <form class="form perfil-form">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" value="Maria Luisa Campos">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" value="email@com">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" value="11 99999-9999">
                </div>

                <div class="campo">
                    <label for="data">Data de Nascimento:</label>
                    <input class="nao-editavel"
                        type="text"
                        id="data"
                        name="data"
                        value="01/01/1900"
                        readonly>
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input class="nao-editavel"
                        type="text"
                        id="cpf"
                        name="cpf"
                        value="111.111.111-11"
                        readonly>
                </div>

                <div class="campo">
                    <label for="usuario">Usuário:</label>
                    <input class="nao-editavel"
                        type="text"
                        id="usuario"
                        name="usuario"
                        value="Malu Campos"
                        readonly>
                </div>
                <a href="perfil.html" class="botao-salvar">Salvar alterações</a>
            </form>
        </main>
    </body>
</html>
